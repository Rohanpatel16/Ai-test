name: Gemma 4 AI Runner (Fast)

on:
  repository_dispatch:
    types: [gemma-query]
  workflow_dispatch:
    inputs:
      prompt:
        description: 'Prompt'
        required: true
        default: 'Explain why the sky is blue in two simple sentences.'
      model:
        description: 'Model variant'
        required: false
        default: 'gemma4:e2b-q4_K_M'

jobs:
  inference:
    runs-on: ubuntu-latest

    steps:
      # 1. Restore Cached Model (~4 seconds for 1.4 GB)
      - name: Cache Ollama Models
        id: cache-ollama
        uses: actions/cache@v4
        with:
          path: ~/.ollama/models
          key: ollama-models-${{ github.event.client_payload.model || github.event.inputs.model || 'gemma4:e2b-q4_K_M' }}

      # 2. Fast Binary Install (Bypasses slow systemd setup - takes ~2 seconds)
      - name: Fast Install Ollama Binary
        run: |
          curl -sL https://ollama.com/download/ollama-linux-amd64.tgz -o /tmp/ollama.tgz
          sudo tar -C /usr -xzf /tmp/ollama.tgz
          rm /tmp/ollama.tgz

      # 3. Start Service
      - name: Start Ollama Service
        run: |
          ollama serve > /dev/null 2>&1 &
          until curl -s http://localhost:11434/api/tags > /dev/null; do
            sleep 0.5
          done

      # 4. Fast CPU Inference
      - name: Run Inference
        id: inference
        run: |
          PROMPT="${{ github.event.client_payload.prompt || github.event.inputs.prompt }}"
          MODEL="${{ github.event.client_payload.model || github.event.inputs.model || 'gemma4:e2b-q4_K_M' }}"

          OUTPUT=$(ollama run "$MODEL" "$PROMPT")

          echo "## 🤖 Gemma AI Response" >> $GITHUB_STEP_SUMMARY
          echo "$OUTPUT" >> $GITHUB_STEP_SUMMARY

          {
            echo "ai_response<<EOF"
            echo "$OUTPUT"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
